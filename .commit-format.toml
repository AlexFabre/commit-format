[header]
# header line regex:
pattern = ^(option: |requirements: |ci: |doc: |release: |script: |format: |test: |quality: ).+$

[body]
# Allow empty body commit message. (i.e. single line commit message).
allow_empty = false

[footer]
# Require a footer line
required = true
# Footer line regex
pattern = ^(Signed-off-by: |Co-authored-by: |Refs: |Fixes: ).+$
